name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test behaviour and access controls
        run: node --test tests/*.test.mjs
      - name: Build the classroom Worker
        run: node scripts/build-worker.mjs
      - name: Prepare Cloudflare package
        run: node scripts/prepare-cloudflare.mjs
      - name: Check generated Worker syntax
        run: node --check .sites-local/cloudflare/public/_worker.js
